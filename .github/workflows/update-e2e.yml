name: Prueba real de actualización

# Dos pruebas en un Windows de verdad:
#  * «compilada» (la que importa antes de publicar): compila este código dos veces (versión actual y una 2.2.99 de
#    prueba firmada), instala la actual como MIEMBRO de un anfitrión y comprueba que se actualiza SOLA a la nueva
#    (instalación automática, sin tocar nada) y vuelve a abrirse.
#  * una etiqueta publicada (p. ej. v2.1.1): instala esa versión como anfitrión y le pide que se actualice desde GitHub.
on:
  workflow_dispatch:
    inputs:
      desde:
        description: "«compilada» o la etiqueta publicada de partida (p. ej. v2.1.1)"
        default: "compilada"

permissions:
  contents: read

jobs:
  automatica:
    if: inputs.desde == 'compilada'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: python -m pip install -r requirements-windows.txt
      - name: Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Compilar la versión actual y una versión nueva de prueba (firmada)
        shell: pwsh
        env:
          DEVCONTROL_SIGNING_KEY: ${{ secrets.DEVCONTROL_SIGNING_KEY }}
          PYTHONUTF8: "1"
        run: |
          python tools/build_windows.py
          $actual = python -c "import devcontrol; print(devcontrol.APP_VERSION)"
          "ACTUAL=$actual" | Out-File -Append $env:GITHUB_ENV
          (Get-Content devcontrol\__init__.py) -replace 'APP_VERSION = "[^"]+"', 'APP_VERSION = "2.2.99"' | Set-Content devcontrol\__init__.py
          python tools/build_windows.py
          python tools/make_manifest.py dist/DEVCONTROL-Setup-2.2.99.exe --repo $env:GITHUB_REPOSITORY --notes "Versión de prueba"
          git checkout -- devcontrol/__init__.py
          Get-ChildItem dist | Format-Table Name, Length | Out-String | Write-Host
      - name: Anfitrión (desde el código) que ofrece la versión nueva y miembro que se actualiza solo
        shell: pwsh
        run: |
          $env:DEVCONTROL_HOME = "$env:RUNNER_TEMP\anfitrion"
          New-Item -ItemType Directory -Force "$env:DEVCONTROL_HOME\Local" | Out-Null
          Set-Content "$env:DEVCONTROL_HOME\Local\instalacion.ini" "[instalacion]`r`nrol = anfitrion`r`npuerto = 8765`r`niniciar_con_windows = no`r`n"
          # Que no consulte GitHub (sustituiría la versión de prueba por la publicada).
          python -c "from devcontrol.config import ensure_config_file, set_values; from devcontrol.paths import default_layout; set_values(ensure_config_file(default_layout()), {('actualizaciones', 'repositorio'): 'Claus29/no-existe-prueba'})"
          $upd = python -c "from devcontrol.paths import default_layout; print(default_layout().ensure().updates_dir)"
          Copy-Item dist\manifest.json, dist\manifest.json.sig, dist\DEVCONTROL-Setup-2.2.99.exe $upd
          Start-Process python -ArgumentList @('-m', 'devcontrol', '--sin-ventana', '--puerto-local', '8771') -RedirectStandardOutput "$env:RUNNER_TEMP\anfitrion.log" -RedirectStandardError "$env:RUNNER_TEMP\anfitrion.err"
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) { Start-Sleep 1; try { Invoke-RestMethod http://127.0.0.1:8765/api/update/manifest -TimeoutSec 2 | Out-Null; $ok = $true; break } catch {} }
          if (-not $ok) { Get-Content "$env:RUNNER_TEMP\anfitrion.err"; throw "El anfitrión no ofrece la versión nueva" }
          Write-Host "El anfitrión ofrece la versión 2.2.99."
          Remove-Item Env:DEVCONTROL_HOME
          # --- miembro (en el mismo paso: así el anfitrión sigue en marcha) ---
          $p = Start-Process -FilePath "dist\DEVCONTROL-Setup-$env:ACTUAL.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          Write-Host "Instalación inicial: código $($p.ExitCode)"
          Set-Content -LiteralPath "$env:LOCALAPPDATA\DEV CONTROL\instalacion.ini" -Value "[instalacion]`r`nrol = miembro`r`nservidor = 127.0.0.1:8765`r`niniciar_con_windows = no`r`n" -Encoding UTF8
          $exe = "$env:LOCALAPPDATA\Programs\DEV CONTROL\DEV CONTROL.exe"
          Write-Host "Instalada: $((Get-Item $exe).VersionInfo.ProductVersion)"
          Start-Process -FilePath $exe -ArgumentList '--sin-ventana'
          $docs = [Environment]::GetFolderPath('MyDocuments')
          $reg = Join-Path $docs 'DEV CONTROL\Actualizaciones\registro.txt'
          $final = $null
          for ($i = 0; $i -lt 150; $i++) {
            Start-Sleep 3
            try { $s = Invoke-RestMethod http://127.0.0.1:8770/local/status -TimeoutSec 2; if ($i % 10 -eq 0) { Write-Host "$(Get-Date -Format HH:mm:ss) versión $($s.version) · actualización: $($s.update.state) $($s.update.auto_in) $($s.update.error)" }; if ($s.version -eq '2.2.99') { $final = $s; break } } catch {}
          }
          Write-Host "===== registro.txt ====="; if (Test-Path $reg) { Get-Content $reg }
          Write-Host "===== instalador.log ====="; $il = Join-Path $docs 'DEV CONTROL\Actualizaciones\instalador.log'; if (Test-Path $il) { Get-Content $il -Tail 40 }
          Write-Host "===== registros ====="; Get-ChildItem "$env:LOCALAPPDATA\DEV CONTROL\Registros" -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName -Tail 30 }
          Write-Host "Versión instalada ahora: $((Get-Item $exe).VersionInfo.ProductVersion)"
          if (-not $final) { Write-Host "===== anfitrión ====="; Get-Content "$env:RUNNER_TEMP\anfitrion.err" -Tail 30 -ErrorAction SilentlyContinue; throw "No se ha actualizado solo a la 2.2.99 o no ha vuelto a abrirse" }
          if (-not (Select-String -Path $reg -Pattern "OK: actualizado de $env:ACTUAL a 2.2.99" -Quiet)) { throw "Falta la comprobación de datos en el registro" }
          Write-Host "Se ha actualizado solo de $env:ACTUAL a 2.2.99 y ha vuelto a abrirse."

  anfitrion:
    # Tu caso: el anfitrión con datos en la 2.1.1 → instalas la versión nueva a mano encima → a partir de ahí se
    # actualiza solo (con copia previa y comprobación de datos) cuando se publica otra.
    if: inputs.desde == 'compilada'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: python -m pip install -r requirements-windows.txt
      - name: Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Compilar la versión actual y una versión nueva de prueba (firmada)
        shell: pwsh
        env:
          DEVCONTROL_SIGNING_KEY: ${{ secrets.DEVCONTROL_SIGNING_KEY }}
          PYTHONUTF8: "1"
        run: |
          python tools/build_windows.py
          $actual = python -c "import devcontrol; print(devcontrol.APP_VERSION)"
          "ACTUAL=$actual" | Out-File -Append $env:GITHUB_ENV
          (Get-Content devcontrol\__init__.py) -replace 'APP_VERSION = "[^"]+"', 'APP_VERSION = "2.2.99"' | Set-Content devcontrol\__init__.py
          python tools/build_windows.py
          python tools/make_manifest.py dist/DEVCONTROL-Setup-2.2.99.exe --repo $env:GITHUB_REPOSITORY --notes "Versión de prueba"
          git checkout -- devcontrol/__init__.py
          Get-ChildItem dist | Format-Table Name, Length | Out-String | Write-Host
      - name: Anfitrión con datos en la 2.1.1 (como el tuyo) e instalar la versión nueva encima a mano
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.1.1 --repo $env:GITHUB_REPOSITORY --pattern "DEVCONTROL-Setup-*.exe" --dir "$env:RUNNER_TEMP\v211"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\v211\DEVCONTROL-Setup-2.1.1.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          Set-Content -LiteralPath "$env:LOCALAPPDATA\DEV CONTROL\instalacion.ini" -Value "[instalacion]`r`nrol = anfitrion`r`niniciar_con_windows = no`r`n" -Encoding UTF8
          Start-Process -FilePath "$env:LOCALAPPDATA\Programs\DEV CONTROL\DEV CONTROL.exe" -ArgumentList '--sin-ventana'
          for ($i = 0; $i -lt 60; $i++) { Start-Sleep 1; try { $s = Invoke-RestMethod http://127.0.0.1:8770/local/status -TimeoutSec 2; if ($s.reachable) { break } } catch {} }
          Write-Host "En marcha: $($s.version) · anfitrión: $($s.is_host)"
          python tools/e2e_datos.py crear
          if ($LASTEXITCODE -ne 0) { throw "No se pudieron crear los datos" }
          # --- instalar a mano la versión nueva encima, con el programa abierto (como harás tú) ---
          $p = Start-Process -FilePath "dist\DEVCONTROL-Setup-$env:ACTUAL.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$env:RUNNER_TEMP\manual.log`"") -Wait -PassThru
          Write-Host "Instalador: código $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\manual.log" -Tail 40; throw "El instalador falló" }
          Get-Content -LiteralPath "$env:LOCALAPPDATA\DEV CONTROL\instalacion.ini"
          Start-Sleep 3
          Get-Process | Where-Object { $_.ProcessName -match 'DEV CONTROL' } | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: GitHub de prueba con una versión más nueva; el anfitrión se actualiza solo
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\falso" | Out-Null
          Copy-Item dist\manifest.json, dist\manifest.json.sig, dist\DEVCONTROL-Setup-2.2.99.exe "$env:RUNNER_TEMP\falso"
          Start-Process python -ArgumentList @('tools\fake_github.py', '8899', "$env:RUNNER_TEMP\falso") -RedirectStandardOutput "$env:RUNNER_TEMP\falso.log" -RedirectStandardError "$env:RUNNER_TEMP\falso.err"
          $env:DEVCONTROL_GITHUB_API = 'http://127.0.0.1:8899'
          Start-Process -FilePath "$env:LOCALAPPDATA\Programs\DEV CONTROL\DEV CONTROL.exe" -ArgumentList '--sin-ventana'
          for ($i = 0; $i -lt 60; $i++) { Start-Sleep 1; try { $s = Invoke-RestMethod http://127.0.0.1:8770/local/status -TimeoutSec 2; if ($s.reachable) { break } } catch {} }
          Write-Host "Tras instalar a mano: versión $($s.version) · anfitrión: $($s.is_host)"
          if ($s.version -ne $env:ACTUAL -or -not $s.is_host) { throw "La instalación a mano no dejó la versión $env:ACTUAL como anfitrión" }
          python tools/e2e_datos.py comprobar
          if ($LASTEXITCODE -ne 0) { throw "Se han perdido datos al instalar a mano" }
          # --- y ahora se actualiza solo a la versión más nueva (mismo paso: el GitHub de prueba sigue en marcha) ---
          $docs = [Environment]::GetFolderPath('MyDocuments')
          $reg = Join-Path $docs 'DEV CONTROL\Actualizaciones\registro.txt'
          $final = $null
          for ($i = 0; $i -lt 150; $i++) {
            Start-Sleep 3
            try { $s = Invoke-RestMethod http://127.0.0.1:8770/local/status -TimeoutSec 2; if ($i % 10 -eq 0) { Write-Host "$(Get-Date -Format HH:mm:ss) versión $($s.version) · $($s.update.state) $($s.update.auto_in) $($s.update.error)" }; if ($s.version -eq '2.2.99' -and $s.reachable) { $final = $s; break } } catch {}
          }
          Write-Host "===== registro.txt ====="; if (Test-Path $reg) { Get-Content $reg }
          Write-Host "===== GitHub de prueba ====="; Get-Content "$env:RUNNER_TEMP\falso.log" -ErrorAction SilentlyContinue
          Write-Host "===== copias ====="; Get-ChildItem (Join-Path $docs 'DEV CONTROL\Copias de seguridad') -ErrorAction SilentlyContinue | Format-Table Name, Length | Out-String | Write-Host
          Write-Host "===== registros ====="; Get-ChildItem "$env:LOCALAPPDATA\DEV CONTROL\Registros" -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName -Tail 25 }
          if (-not $final) { throw "El anfitrión no se ha actualizado solo o no ha vuelto a abrirse" }
          if (-not (Select-String -Path $reg -Pattern "OK: actualizado de $env:ACTUAL a 2.2.99 correctamente. Datos comprobados" -Quiet)) { throw "Falta la comprobación de datos" }
          python tools/e2e_datos.py comprobar
          if ($LASTEXITCODE -ne 0) { throw "Se han perdido datos al actualizarse solo" }
          Write-Host "El anfitrión se ha actualizado solo de $env:ACTUAL a 2.2.99, con copia previa y sin perder datos."

  actualizar:
    if: inputs.desde != 'compilada'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Descargar e instalar la versión de partida
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DESDE: ${{ inputs.desde }}
        run: |
          gh release download $env:DESDE --repo $env:GITHUB_REPOSITORY --pattern "DEVCONTROL-Setup-*.exe" --dir "$env:RUNNER_TEMP\inst"
          $setup = Get-ChildItem "$env:RUNNER_TEMP\inst\DEVCONTROL-Setup-*.exe" | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$env:RUNNER_TEMP\inst\primera.log`"") -Wait -PassThru
          Write-Host "Instalador de partida: código $($p.ExitCode)"
          $exe = "$env:LOCALAPPDATA\Programs\DEV CONTROL\DEV CONTROL.exe"
          if (-not (Test-Path $exe)) { Get-Content "$env:RUNNER_TEMP\inst\primera.log" -Tail 60; throw "No se instaló" }
          (Get-Item $exe).VersionInfo | Format-List FileVersion, ProductVersion
          # Como el equipo del usuario: este equipo es el anfitrión (el instalador silencioso deja «miembro»).
          Set-Content -LiteralPath "$env:LOCALAPPDATA\DEV CONTROL\instalacion.ini" -Value "[instalacion]`r`nrol = anfitrion`r`niniciar_con_windows = no`r`n" -Encoding UTF8
          Get-ChildItem "$env:LOCALAPPDATA\DEV CONTROL" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName | Out-String | Write-Host

      - name: Abrir el programa y pedir la actualización
        shell: pwsh
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\DEV CONTROL\DEV CONTROL.exe"
          Start-Process -FilePath $exe -ArgumentList '--sin-ventana'
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) { Start-Sleep 1; try { $s = Invoke-RestMethod http://127.0.0.1:8770/local/status -TimeoutSec 2; $ok = $true; break } catch {} }
          if (-not $ok) { throw "El programa no arrancó" }
          Write-Host "Versión en marcha: $($s.version) (anfitrión: $($s.is_host))"
          $h = @{ 'Content-Type' = 'application/json' }
          Invoke-RestMethod -Method Post http://127.0.0.1:8770/local/update/check -Headers $h -Body '{}' | Out-Null
          for ($i = 0; $i -lt 60; $i++) { Start-Sleep 2; $u = Invoke-RestMethod http://127.0.0.1:8770/local/update; if ($u.state -ne 'checking' -and $u.latest) { break } }
          $u | ConvertTo-Json -Depth 4 | Write-Host
          if (-not $u.can_apply) { throw "No se puede instalar: $($u.error) $($u.reason)" }
          try { Invoke-RestMethod -Method Post http://127.0.0.1:8770/local/update/apply -Headers $h -Body '{}' | ConvertTo-Json | Write-Host } catch { Write-Host "apply: $_" }

      - name: Esperar a que termine y comprobar
        shell: pwsh
        run: |
          $docs = [Environment]::GetFolderPath('MyDocuments')
          $reg = Join-Path $docs 'DEV CONTROL\Actualizaciones\registro.txt'
          $exe = "$env:LOCALAPPDATA\Programs\DEV CONTROL\DEV CONTROL.exe"
          $done = $false
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep 2
            if ((Test-Path $reg) -and (Select-String -Path $reg -Pattern 'OK: actualizado|FALLO|ha fallado|Se ha vuelto' -Quiet)) { $done = $true; break }
          }
          Start-Sleep 10
          Write-Host "===== registro.txt ====="; if (Test-Path $reg) { Get-Content $reg }
          Write-Host "===== instalador.log (final) ====="; $il = Join-Path $docs 'DEV CONTROL\Actualizaciones\instalador.log'; if (Test-Path $il) { Get-Content $il -Tail 80 }
          Write-Host "===== carpeta Actualizaciones ====="; Get-ChildItem (Join-Path $docs 'DEV CONTROL\Actualizaciones') | Format-Table Name, Length, LastWriteTime | Out-String | Write-Host
          Write-Host "===== guion ====="; $ps = Join-Path $docs 'DEV CONTROL\Actualizaciones\aplicar_actualizacion.ps1'; if (Test-Path $ps) { Get-Content $ps }
          Write-Host "===== registros del programa ====="; Get-ChildItem "$env:LOCALAPPDATA\DEV CONTROL" -Recurse -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.FullName)"; Get-Content $_.FullName -Tail 40 }
          Write-Host "===== procesos ====="; Get-Process | Where-Object { $_.ProcessName -match 'DEV CONTROL|powershell|DEVCONTROL' } | Format-Table Id, ProcessName, StartTime | Out-String | Write-Host
          $ver = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "Versión instalada ahora: $ver"
          $running = $false
          try { $s = Invoke-RestMethod http://127.0.0.1:8770/local/status -TimeoutSec 3; $running = $true; Write-Host "Programa abierto de nuevo: $($s.version)" } catch { Write-Host "El programa no se ha vuelto a abrir." }
          if (-not $done) { throw "La actualización no terminó (ni bien ni mal) en 4 minutos" }
          if (-not (Select-String -Path $reg -Pattern 'OK: actualizado' -Quiet)) { throw "La actualización falló (ver registro)" }
          if (-not $running) { throw "Se actualizó pero el programa no volvió a abrirse" }
